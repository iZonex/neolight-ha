name: New monitor or panel model
description: Share observations for a NeoLight monitor, entrance panel, or adapter.
title: "Model support: "
body:
  - type: markdown
    attributes:
      value: |
        Only test devices and accounts you own or are authorized to use. Do not attach raw captures, credentials, tokens, device IDs, camera images, or complete RTSP URLs. See [the research guide](https://github.com/iZonex/neolight-ha/blob/main/docs/REVERSE_ENGINEERING.md) for a redacted report format.
  - type: input
    id: model
    attributes:
      label: Monitor and firmware
      placeholder: "Model name, firmware version"
    validations:
      required: true
  - type: input
    id: panel
    attributes:
      label: Entrance panel and wiring
      placeholder: "IP/analog panel, adapter model, relay wiring if known"
  - type: textarea
    id: capabilities
    attributes:
      label: Observed behavior
      description: For each feature, state the action, expected result, actual physical result, and how it was measured.
      placeholder: "Call / video / audio in / audio out / Lock 1 / Lock 2 / call end"
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: Redacted protocol evidence
      description: Include DP code and type, protocol and codec, or a minimal sanitized trace. Mark inferred facts clearly.
  - type: textarea
    id: limitations
    attributes:
      label: Unverified behavior and limitations
